name: Runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[test] build twine
      - run: python -m pytest -m "not integration"
      - run: python -m build
      - run: python -m twine check dist/*
# Publishing is intentionally absent until reviewed artifacts, name registration,
# real integration checks and the new publisher identity are established.
