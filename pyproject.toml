[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-docker"
version = "0.1.0a3"
description = "Explicit Docker container lifecycle and bounded execution for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["docker>=7.2,<8", "requests>=2.32,<3", "pydantic>=2.13,<3", "pydantic-settings>=2.14.2,<3", "filelock>=3.20,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.17.3"]

[project.urls]
Homepage = "https://github.com/amadou-6e/py-docker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test_suite"]
markers = ["integration: uses a real local Docker engine"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

